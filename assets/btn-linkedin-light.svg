<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="52" viewBox="0 0 200 52" role="img" aria-label="LinkedIn"><title>LinkedIn</title><style>
    .l{font:700 16px 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#0f172a}
    .shine{animation:shine 5s ease-in-out infinite}
    @keyframes shine{0%,60%{transform:translateX(-120px)}85%,100%{transform:translateX(320px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
    <defs><clipPath id="c"><rect x="1" y="1" width="198" height="50" rx="26"/></clipPath>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891b2" stop-opacity="0"/><stop offset=".5" stop-color="#0891b2" stop-opacity=".22"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b3df5"/><stop offset="1" stop-color="#0891b2"/></linearGradient></defs>
    <rect x="1" y="1" width="198" height="50" rx="26" fill="#f6f8fb" stroke="url(#b)" stroke-width="1.5"/>
    <g clip-path="url(#c)"><rect class="shine" style="animation-delay:0s" x="0" y="0" width="90" height="52" fill="url(#s)" transform="skewX(-20)"/></g>
    <g transform="translate(34 14)"><rect x="2" y="2" width="20" height="20" rx="4" fill="#0a66c2"/><text x="12" y="17.5" text-anchor="middle" style="font:800 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#fff">in</text></g>
    <text class="l" x="116.0" y="32" text-anchor="middle">LinkedIn ↗</text></svg>