<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Have an interesting idea? Let&#x27;s connect."><title>Have an interesting idea? Let&#x27;s connect.</title><style>
    .w{animation:wave 9s linear infinite} .w2{animation-duration:13s;animation-direction:reverse} .w3{animation-duration:17s}
    @keyframes wave{to{transform:translateX(240px)}}
    .big{font:800 34px 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;letter-spacing:-1px}
    .sub{font:500 17px 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#526075}
    .hand{transform-box:fill-box;transform-origin:70% 80%;animation:hand 2.4s ease-in-out infinite}
    @keyframes hand{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
    <defs>
