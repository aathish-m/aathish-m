        <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/></linearGradient>
      <clipPath id="fc"><rect width="1200" height="220" rx="28"/></clipPath>
    </defs>
    <g clip-path="url(#fc)">
      <rect width="1200" height="220" fill="#f6f8fb"/>
      <path class="w w3" d="M-480 150 q60.0 -10 120.0 0 t120.0 0 q60.0 -10 120.0 0 t120.0 0 q60.0 -10 120.0 0 t120.0 0 q60.0 -10 120.0 0 t120.0 0 q60.0 -10 120.0 0 t120.0 0 q60.0 -10 120.0 0 t120.0 0 q60.0 -10 120.0 0 t120.0 0 q60.0 -10 120.0 0 t120.0 0 q60.0 -10 120.0 0 t120.0 0 V220 H-480 Z" fill="#db2777" fill-opacity=".10"/>
      <path class="w w2" d="M-420 165 q60.0 -14 120.0 0 t120.0 0 q60.0 -14 120.0 0 t120.0 0 q60.0 -14 120.0 0 t120.0 0 q60.0 -14 120.0 0 t120.0 0 q60.0 -14 120.0 0 t120.0 0 q60.0 -14 120.0 0 t120.0 0 q60.0 -14 120.0 0 t120.0 0 q60.0 -14 120.0 0 t120.0 0 q60.0 -14 120.0 0 t120.0 0 V220 H-480 Z" fill="#0891b2" fill-opacity=".13"/>
      <path class="w" d="M-360 182 q60.0 -12 120.0 0 t120.0 0 q60.0 -12 120.0 0 t120.0 0 q60.0 -12 120.0 0 t120.0 0 q60.0 -12 120.0 0 t120.0 0 q60.0 -12 120.0 0 t120.0 0 q60.0 -12 120.0 0 t120.0 0 q60.0 -12 120.0 0 t120.0 0 q60.0 -12 120.0 0 t120.0 0 q60.0 -12 120.0 0 t120.0 0 V220 H-480 Z" fill="#5b3df5" fill-opacity=".18"/>
    </g>
    <rect x=".5" y=".5" width="1199" height="219" rx="28" fill="none" stroke="#e2e8f0"/>
    <text class="big" x="600.0" y="86" text-anchor="middle" fill="url(#fg)">Have an interesting idea? Let's connect.</text>
    <text class="sub" x="600.0" y="122" text-anchor="middle">Thanks for stopping by — I'm always happy to talk frontend, UI details and problem solving.</text></svg>