<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="270" viewBox="0 0 600 270" role="img" aria-label="02 EventHub — A JavaScript project created for the Melinia hackathon — an experiment in collaboration."><title>02 EventHub — A JavaScript project created for the Melinia hackathon — an experiment in collaboration.</title><style>
